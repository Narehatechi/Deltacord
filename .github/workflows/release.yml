name: Release
on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

jobs:
    windows:
        name: Build the Windows app
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install
              run: npm install --no-audit --no-fund

            - name: Type-check
              run: npm run typecheck

            - name: Set the version
              shell: bash
              run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version

            - name: Build
              run: npm run build

            - name: Package
              run: npx electron-builder --win --publish never

            - name: Publish the release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  gh release create "$version" --target "$GITHUB_SHA" --title "Deltacord $version" \
                      --notes "Download **Deltacord-Setup.exe** below and double-click it. Installed copies update to this automatically." \
                      release/Deltacord-Setup.exe release/Deltacord-Setup.exe.blockmap release/latest.yml
